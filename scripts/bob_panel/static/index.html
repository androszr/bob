<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bob · panel</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/panel.css">
<script>
try { const t = localStorage.getItem('bob-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="ds-nav">
    <div class="ds-nav-header"><h1>Bob · panel</h1><p id="owner-sub">assistant on Teams</p>
      <div class="state-pill"><span id="dot" class="dot"></span><span id="headline">…</span></div></div>
    <div id="nav"></div>
    <div class="nav-foot">
      <a class="ds-link" id="theme" style="cursor:pointer">Dark / light mode</a>
      <span>Terminal: <code>./bob</code> opens this panel</span>
    </div>
  </aside>
  <main class="ds-main" id="main"></main>
  <div id="modal"></div>
  <div id="tip" role="tooltip"></div>
</div>
<script>
// ---- shared --------------------------------------------------------------------------------------
const PAGES = [
  ['Day to day', [['dashboard','Dashboard','dashboard'],['approvals','Approvals','tick'],['conversations','Conversations','chatbubbles'],['logs','Logs and problems','shield']]],
  ["Bob's settings", [['chats','Chats','settings'],['roles','Roles','user'],['schedule','Schedule','schedule']]],
];
const ALL = PAGES.flatMap(g=>g[1]);
let tab = (location.hash||'#dashboard').slice(1); if(!ALL.some(t=>t[0]===tab)) tab='dashboard';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = n => `<span class="ic" style="--ic:url(/static/icons/${n}.svg)"></span>`;
const ago = iso => { const s=(Date.now()-new Date(iso))/1000; return s<60?`${Math.round(s)} s`:s<3600?`${Math.round(s/60)} min`:s<86400?`${Math.round(s/3600)} h`:`${Math.round(s/86400)} d`; };
const when = iso => { if(!iso) return '-'; const d = new Date(iso); if(isNaN(d)) return esc(iso);
  return `${d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} <span class="muted">(${ago(iso)} ago)</span>`; };
const api = (p, body) => fetch(p, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(r=>r.json());
const btn = (label, attrs='', kind='secondary') => `<button class="ds-btn ds-btn--sm ds-btn--${kind}" ${attrs}>${label}</button>`;
const badge = (t, c='gray', title='') => `<span class="ds-badge ds-badge--md ds-badge--${c}" ${title?`title="${esc(title)}"`:''}>${t}</span>`;
const callout = (kind, html) => `<div class="ds-callout ds-callout--${kind}">${ic({success:'tick',warning:'warning',danger:'cross',info:'info',neutral:'info'}[kind])}<div>${html}</div></div>`;
const head = (title, desc, help='') => `<div class="page-head"><h1>${title}</h1><p>${desc}</p>${help?`<details class="help"><summary>How does it work?</summary><div>${help}</div></details>`:''}</div>`;
const table = (cols, rows) => `<div class="ds-table-wrap"><table class="ds-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
const bobImg = (name, cls='', id='') => `<img ${id?`id="${id}"`:''} class="${cls}" src="/static/bob/${esc(name||'bob-static-base')}.svg" alt="Bob">`;
// which mascot stands for which situation (static/bob/README.md lists the whole set)
const MOOD = {'good-vibe':'bob-happy', 'lock':'bob-notification', 'no-connection':'bob-disconnected', 'thinking':'bob-working-thinking', 'chat':'bob-idle-living', 'files':'bob-fishing'};
const empty = (mood, title, desc) => `<div class="ds-empty">${bobImg(MOOD[mood])}<div class="ds-empty-title">${title}</div><div class="ds-empty-desc">${desc}</div></div>`;
let OWNER = '';
let pendingCount = 0, PROBLEMS = 0;

function nav(){
  $('#nav').innerHTML = PAGES.map(([g, items]) => `<div class="ds-nav-section">${g}</div>` + items.map(([k,l,i]) =>
    `<a class="${k===tab?'active':''}" data-t="${k}">${ic(i)}${l}${k==='approvals'&&pendingCount?`<span class="nav-count">${badge(pendingCount,'red')}</span>`:''}${k==='logs'&&PROBLEMS?`<span class="nav-count">${badge(PROBLEMS,'yellow')}</span>`:''}</a>`).join('')).join('');
  document.querySelectorAll('#nav a').forEach(a=>a['onclick']=()=>go(a.dataset.t));
}
function go(t){ tab=t; location.hash=t; EDIT=null; RED=null; KN=null; window.scrollTo(0,0); return render(); }

async function header(){
  try { const [s, a] = await Promise.all([api('/api/status'), api('/api/approvals')]); pendingCount = a.pending.length;
    const ts = s.teams_session||{};
    $('#dot').className = 'dot ' + (!s.bob.running ? 'bad' : ts.login_needed||ts.warn ? 'warn' : 'ok');
    $('#headline').innerHTML = s.bob.running ? `Bob is running · activity ${s.last_activity?ago(s.last_activity)+' ago':'-'}` : '<b>Bob is not running</b>';
    OWNER = s?.owner || ''; $('#owner-sub').textContent = OWNER ? `assistant: ${OWNER}` : 'assistant on Teams';
    nav(); return {s, a};
  } catch(e){ $('#headline').textContent = 'panel not responding'; }
}

async function bobAction(kind, b){
  const q = {restart:'Restart Bob? He will not answer for about 30 s (messages from that time are handled after the start).', stop:'Stop Bob? He will not answer in any chat until you start him again.'}[kind];
  if(q && !confirm(q)) return;
  // after the re-render the clicked button is gone: show the result next to the first Bob control on the page
  const msg = () => document.querySelector('[data-bob]')?.parentElement.querySelector('.msg');
  b['disabled'] = true; b.parentElement.querySelector('.msg').textContent = kind==='restart'?'Restarting… (up to 30 s)':'One moment…';
  try { const r = await api(`/api/bob/${kind}`, {by:'panel'}); await render(); const m = msg(); if(m) m.textContent = r?.message || ''; }
  finally { b['disabled'] = false; }
}

// ---- Dashboard: what to do now --------------------------------------------------------------------
function nextStep(s, lg){
  const ts = s.teams_session||{};
  if(lg.running) return `<div class="box hero">${bobImg('bob-notification')}<div><h2>Finish signing in to Teams</h2>
      <p>A browser window has opened on this Mac.</p>
      <ol class="steps"><li>Sign in with your organisation account (SSO, then MFA on your phone).</li><li>When asked "Stay signed in?", choose <b>Yes</b> - the session lasts 7 days.</li><li>When you see Teams with the chat list on the left, click below.</li></ol>
      <div class="row">${btn('I\'m signed in','id="b-login-ok"','primary')}<span class="msg" id="lmsg"></span></div>
      ${(lg.log||[]).length?`<details class="help"><summary>Sign-in details</summary><pre>${esc(lg.log.join('\n'))}</pre></details>`:''}</div></div>`;
  if(ts.login_needed) return `<div class="box hero">${bobImg('bob-notification')}<div><h2>Sign Bob in to Teams</h2>
      <p>The Teams session ${ts.exists?'has expired':'does not exist'} (it lasts 7 days). Bob cannot start without it. Signing in opens a browser on this Mac and takes about a minute.</p>
      ${lg.exit_code?callout('danger',`The last sign-in failed (${when(lg.finished)}). Try again and click "I'm signed in" only once you can see Teams.`):''}
      <div class="row">${s.bob.running?'':btn('Sign in and start Bob','id="b-login-start"','primary')}${btn('Sign in to Teams','id="b-login"',s.bob.running?'primary':'secondary')}<span class="msg" id="lmsg"></span></div></div></div>`;
  if(!s.bob.running) return `<div class="box hero">${bobImg('bob-disconnected')}<div><h2>Bob is stopped</h2>
      <p>He is not answering in any chat and not sending scheduled messages. The Teams session is valid, so just start him.</p>
      <div class="row">${btn('Start Bob','data-bob="start"','primary')}<span class="msg"></span></div></div></div>`;
  if(pendingCount) return `<div class="box hero">${bobImg('bob-working-thinking')}<div><h2>${pendingCount===1?'One decision is waiting':`Decisions waiting for you: ${pendingCount}`}</h2>
      <p>Bob, Claude Code or an automation is asking for approval - e.g. to deploy a change or save knowledge. Nothing moves until you decide.</p>
      <div class="row">${btn('Go to approvals','data-go="approvals"','primary')}</div></div></div>`;
  return `<div class="box hero">${bobImg('bob-happy')}<div><h2>Everything works</h2>
      <p>Bob is answering in chats, the Teams session is valid for another ${Math.max(0, Math.floor((ts.max_age_h-ts.age_h)/24))} days, nothing is waiting for your decision.${PROBLEMS?` The logs from the last day have errors (${PROBLEMS} kinds) - <a class="ds-link" data-go="logs">see them</a>.`:''}</p></div></div>`;
}
const VIEWS = {
  async dashboard(){
    const {s} = await header() || {}; if(!s) return '';
    const lg = s?.login||{}, ts = s.teams_session||{}, sup = s?.supervisor||{};
    let D = null;
    try { const [l, d] = await Promise.all([api('/api/bob/logs?hours=24&level=warn'), api('/api/dashboard?hours=24')]); D = d;
      PROBLEMS = (l?.problems||[]).filter(p=>p?.level==='error').length; nav(); } catch(e){}
    const daysLeft = ts.exists ? Math.max(0,(ts.max_age_h-ts.age_h)/24) : 0;
    return head('Dashboard', 'Bob\'s state and what is worth doing now. If something needs your attention, you will see it at the top with step-by-step instructions.',
        'Bob is a program on this Mac that reads Teams chats as you and answers in them. The panel starts him, stops him and signs him in to Teams - you no longer need the terminal (<code>./bob</code> only opens the panel). The panel starts by itself when you log in to the Mac and brings Bob back up if he was running before the restart.')
      + nextStep(s, lg)
      + `<div class="grid">
        <div class="ds-card ds-stat ${s.bob.running?'ds-stat--highlight':''}"><span class="ds-stat-label">Bob</span><span class="ds-stat-value ${s.bob.running?'ds-stat-value--success':'ds-stat-value--danger'}">${s.bob.running?'running':'stopped'}</span><span class="muted">${s.bob.running?`since ${esc(s.bob.started)}`:''}</span></div>
        <div class="ds-card ds-stat"><span class="ds-stat-label">Teams session</span><span class="ds-stat-value ${ts.login_needed?'ds-stat-value--danger':ts.warn?'ds-stat-value--warning':''}">${ts.login_needed?'expired':`${daysLeft.toFixed(1)} days left`}</span>
          <div class="ds-progress-track"><div class="ds-progress-fill ds-progress-fill--${ts.login_needed?'red':ts.warn?'yellow':'green'}" style="width:${Math.min(100,daysLeft/7*100)}%"></div></div></div>
        <div class="ds-card ds-stat"><span class="ds-stat-label">Last activity in chats</span><span class="ds-stat-value">${s.last_activity?ago(s.last_activity)+' ago':'-'}</span></div>
      </div>
      ${D?liveDashboard(D):''}
      <div class="box"><h2>Controls</h2><p class="sub">A restart helps when Bob has stopped answering or after his code changed. Stop him if he should stay quiet for longer (for a short while "Bob pause 30 min" in Notes is enough). Restart is blocked while the Teams session is expired - sign in first.</p>
        <div class="row">${s.bob.running?btn('Restart Bob','data-bob="restart"','primary')+btn('Stop','data-bob="stop"'):btn('Start Bob','data-bob="start"','primary')}${lg.running||ts.login_needed?'':btn('Sign in to Teams again','id="b-login"','tertiary')}<span class="msg"></span></div>
        <p class="muted" style="margin-top:var(--space-12)">Last restart from the panel: ${when(sup.last_restart)} ${esc(sup.last_restart_by||'')}${s.bob.running?` · ${s.bob.managed?'started from the panel':'started in a terminal'} · pid ${esc(s.bob.pid)}`:''}</p></div>`;
  },

  // ---- Approvals ----------------------------------------------------------------------------------
  async approvals(){
    const a = await api('/api/approvals'); pendingCount = a.pending.length; nav();
    const card = r => `<div class="apr" data-id="${esc(r.id)}"><h3>${esc(r?.title)}</h3>
      <div class="muted">${esc(r?.source||'')} · ${when(r.created_at)} · <code>${esc(r.id)}</code></div>
      ${r.details?`<details ${r.details.length<400?'open':''}><summary>Details and differences</summary><pre>${esc(r?.details)}</pre></details>`:''}
      <label class="lbl">Note for the decision (optional)<textarea class="ds-input"></textarea></label>
      <div class="row">${btn('Approve','data-a="1"','primary')}${btn('Reject','data-a="0"','danger')}<span class="msg"></span></div></div>`;
    const done = a.done.map(r=>`<tr><td>${when(r.decided_at)}</td><td>${esc(r?.title)}</td><td>${r.status==='approved'?badge('approved','green'):badge('rejected','red')}</td><td>${esc(r?.note||'')}</td></tr>`).join('');
    return head('Approvals', 'Here Bob, Claude Code and automations ask for your approval before doing something important: deploying a script change, saving new knowledge, publishing a change. Nothing happens until you decide.',
        'Every new request also goes to Notes on Teams. When you are away from the computer, reply there "Bob, approve apr-…" or "Bob, reject apr-…" (after a colon you can add a note). When only one decision is waiting, "Bob, approve" is enough.')
      + `<div class="box"><h2>Waiting for your decision (${a.pending.length})</h2>${a.pending.map(card).join('')||empty('good-vibe','Nothing waiting','When something needs your approval, it will show up here and in Notes.')}</div>
      <div class="box"><h2>Recent decisions</h2>${done?table(['When','What','Decision','Note'], done):'<span class="muted">None.</span>'}</div>`;
  },

  // ---- Conversations (log.jsonl) --------------------------------------------------------------------
  async conversations(){
    const t = await api('/api/tasks?limit=150');
    const chats = [...new Set(t.map(e=>e?.chat).filter(Boolean))].sort();
    const shown = t.filter(e=>(e?.text||e?.reply) && (!ACHAT || e?.chat===ACHAT));
    return head('Conversations', 'Recent messages Bob reacted to: who wrote, in which chat and what Bob answered. Technical events (polling, skipped empty messages) are hidden - the full record is in "Logs".')
      + `<div class="box"><div class="row between"><h2>Recent conversations</h2><label class="row" style="flex-wrap:nowrap">Chat <select class="ds-input" id="achat" style="height:32px;width:260px"><option value="">all</option>${chats.map(c=>`<option ${c===ACHAT?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
      ${shown.length?table(['When','Chat','Who','Message','Bob\'s reply'], shown.map(e=>`<tr><td style="white-space:nowrap">${when(e.ts)}</td><td>${badge(esc(e?.chat||'-'))}</td><td>${esc(e?.sender||'')}</td><td>${esc(e?.text)}</td><td class="muted">${e.reply==='<silent/>'||!e?.reply?badge('no reply'):esc(e?.reply)}</td></tr>`).join('')):empty('chat','No conversations','There have been no recent messages to Bob in the selected chat.')}</div>`;
  },

  // ---- Logs -----------------------------------------------------------------------------------------
  async logs(){
    const l = await api('/api/bob/logs?'+new URLSearchParams(LOGF).toString());
    PROBLEMS = (l?.problems||[]).filter(p=>p?.level==='error').length; nav();
    const lvl = {error:['error','red'], warn:['warning','yellow'], info:['info','gray'], debug:['routine','gray']};
    const seg = (key, opts) => `<div class="ds-segmented">${opts.map(([v,lab])=>`<button class="ds-segment ${String(LOGF[key])===String(v)?'active':''}" data-lf="${key}" data-v="${v}">${lab}</button>`).join('')}</div>`;
    const lab = s => esc((l?.labels||{})[s]||s);
    const probs = (l?.problems||[]).map(p=>callout(p?.level==='error'?'danger':'warning',
      `<b>${lab(p?.source)}</b>: ${esc(p.text.slice(0,220))}<br><span class="muted">${p.count>1?`${p.count} times, last `:''}${when(p?.last)}</span>`)).join('');
    const lines = (l?.entries||[]).slice().reverse().map(e=>`<div class="logline"><span class="t">${esc(e.ts.slice(11,19))}</span><span>${badge(lvl[e?.level][0], lvl[e?.level][1])}</span><span>${badge(lab(e?.source),'blue')}</span>
      <span class="x">${esc(e?.text)}${e.count>1?' '+badge('×'+e?.count,'violet',`until ${e.last.slice(11,19)}`):''}${e.extra.length?`<details><summary class="muted">details (${e.extra.length})</summary><pre>${esc(e.extra.join('\n'))}</pre></details>`:''}</span></div>`).join('');
    return head('Logs and problems', 'What Bob did and what went wrong. At the top, problems from the last day (grouped); below, the timeline - repeated entries are collapsed (×N) and routine ones (chat polling, token refresh, health checks) are hidden.',
        'A single "get_messages error" (Teams timeout) is normal - Bob retries by himself. Worrying signs are: repeated send errors, "claude CLI timeout", an expired session, and no activity while something is happening in the chats. A restart on the Dashboard helps then.')
      + `<div class="box"><h2>Problems in the last day</h2>${probs||callout('success','No errors or warnings in the last day.')}</div>
      <div class="box"><div class="row" style="margin-bottom:var(--space-12)">
        ${seg('level',[['warn','Problems only'],['info','Important'],['debug','Everything']])}${seg('hours',[[1,'1 h'],[6,'6 h'],[24,'24 h']])}
        <select class="ds-input" id="lsrc" style="height:32px;width:auto"><option value="">all sources</option>${Object.entries(l?.sources||{}).map(([k,n])=>`<option value="${esc(k)}" ${k===LOGF.source?'selected':''}>${lab(k)} (${n})</option>`).join('')}</select>
        <input class="ds-input" id="lq" placeholder="Search the log (Enter)…" value="${esc(LOGF.q)}" style="height:32px;width:220px"></div>
        <p class="muted">In the window: ${l.total||0} entries - errors ${l.counts?.error||0}, warnings ${l.counts?.warn||0}, important ${l.counts?.info||0}, routine ${l.counts?.debug||0}. Newest at the top.</p>
        ${lines||'<span class="muted">No entries for these filters.</span>'}
        <details class="help"><summary>Raw log (last 300 lines, as in the terminal)</summary><pre id="rawlog">…</pre></details></div>`;
  },

  // ---- Schedule -------------------------------------------------------------------------------------
  async schedule(){
    const s = await api('/api/schedule');
    const fmtT = t => Object.entries(t||{}).map(([k,v])=>badge(`${esc(k.replace('generate_send','send').replace('generate','prepare'))} ${esc(v)}`,'brand')).join('');
    const every = s => s>=3600?`every ${s/3600} h`:s>=60?`every ${s/60} min`:`every ${s} s`;
    return head('Schedule', 'Messages Bob sends by himself at fixed times (e.g. the team\'s morning work-log posts), and the loops he uses to keep checking queues and data sources.')
      + `<div class="box"><h2>Scheduled messages</h2>${table(['Job','When','Enabled','Last sent'], s.broadcasts.map(b=>`<tr><td><b>${esc(b?.name)}</b><br><span class="muted">${esc(b?.description)}</span></td><td>${fmtT(b?.times)}</td><td>${b.enabled===null?badge('?'):b?.enabled?badge('yes','green'):badge('no')}${b.disabled_reason?`<br><span class="muted">${esc(b.disabled_reason)}</span>`:''}</td><td>${when(b.last_fired)}</td></tr>`).join(''))}</div>
      <div class="box"><h2>Background loops</h2><p class="sub">What Bob checks by himself, without being asked. Changing how often needs a code change (<code>scripts/teams_agent/cli.py</code>).</p>${table(['Loop','How often','What it does'], s.loops.map(l=>`<tr><td><code>${esc(l?.name)}</code></td><td>${every(l.every_s)}</td><td class="muted">${esc(l?.what)}</td></tr>`).join(''))}</div>`;
  },

  // ---- Chats ----------------------------------------------------------------------------------------
  async chats(){
    const [c, cfg, rl] = await Promise.all([api('/api/chats'), api('/api/chat-config'), api('/api/roles')]); CFG = cfg; ROLES = rl;
    const rname = Object.fromEntries(rl.roles.map(r=>[r.id, `${r.emoji||''} ${r.name}`]));
    const off = Object.fromEntries(cfg.chats.map(x=>[x?.name, x?.disabled]));
    return head('Chats', 'The Teams chats Bob works in. Each chat has roles (what Bob does there and which tools he can use), the name Bob goes by, and who can call him.',
        'A chat\'s access = the tools of its roles + the "add / remove" adjustments. In chats with external users (an "external" chat) Bob never gets tools marked 🔒 ("team only") - even if a role has them. A change takes effect within seconds; a new chat starts being watched after Bob restarts. Turning a chat off takes effect at once and can be undone.')
      + editor() + `<div class="box"><div class="row between"><h2>Chats (${c.length})</h2>${btn('+ Add chat','data-edit=""','primary')}</div>
      ${table(['Chat','Roles','Who calls','Access','Activity',''], c.map(x=>`<tr class="${off[x?.name]?'off':''}"><td><b>${esc(x?.name)}</b>${off[x?.name]?' '+badge('off','red'):''}<br><span class="muted">Bob goes by ${esc(x?.label||'Bob')}</span><br>${x.flags.map(f=>badge(esc(f))).join('')}</td>
        <td>${x.roles?x.roles.map(r=>badge(esc(rname[r]||r),'brand')).join('')||'<span class="muted">none</span>':'<span class="muted">manual list</span>'}</td>
        <td>${esc({all:'everyone',owner:'owner only',auto:'Bob decides'}[x?.caller]||x?.caller||'-')}</td>
        <td>${x.all_groups?badge('all default','green'):''}${x.groups.filter(g=>!x.all_groups||!(rl.default_groups||[]).includes(g)).map(g=>badge(grpLabel(g))).join('')}</td>
        <td style="white-space:nowrap">${when(x.last_activity)}</td>
        <td style="white-space:nowrap">${btn('Edit',`data-edit="${esc(x?.name)}"`)} ${x.name===cfg.control_chat?'':btn(off[x?.name]?'Turn on':'Turn off',`data-onoff="${esc(x?.name)}" data-on="${off[x?.name]?1:0}"`,'tertiary')}</td></tr>`).join(''))}</div>`;
  },

  // ---- Roles ----------------------------------------------------------------------------------------
  async roles(){
    ROLES = await api('/api/roles');
    if(ROLETAB!=='_groups' && !ROLES.roles.some(r=>r.id===ROLETAB)) ROLETAB = ROLES.roles[0]?.id || '_groups';
    const rt = ROLETAB;
    const jobs = (ROLES.jobs||[]).map(j=>`<tr><td>${when(j?.start)}</td><td>${esc(j?.name)} <span class="muted">(${esc(j?.role)})</span></td><td>${badge(esc(jobSt[j?.status]||j?.status), {applied:'green',failed:'red',awaiting:'yellow',rejected:'gray',running:'blue'}[j?.status]||'gray')}${j.error?`<br><span class="muted">${esc(j?.error)}</span>`:''}</td></tr>`).join('');
    return head('Bob\'s roles', 'Bob wears different "hats": he is the Assistant, a Project Manager or anyone you describe in the roles file. A role is tool access, skills and knowledge; in each chat it can go by a different name.',
        'You can browse a role\'s knowledge ("Show") and change it without editing files: "Edit with Claude" - describe what to fix; "Add knowledge" - describe what it should contain. Claude prepares the file and the proposal with its differences goes to "Approvals" - it is saved only after you approve (the previous version stays in the archive). Knowledge "in the prompt" reaches Bob with every message in chats with that role, right away.')
      + (ROLES.no_file ? callout('warning','There is no roles file yet. Copy <code>roles.example.json</code> to <code>roles.json</code> (in the repository folder) and refresh the page - or set the path in <code>BOB_ROLES_FILE</code>.') : '')
      + `<div class="personas" role="tablist">${ROLES.roles.map(r=>`<div class="persona ${r.id===rt?'active':''}" role="tab" aria-selected="${r.id===rt}" data-rtab="${esc(r.id)}">${bobImg(r?.image)}<b>${esc(r?.name)}</b><span>${(r?.channels||[]).length} chats</span></div>`).join('')}
          <div class="persona ${rt==='_groups'?'active':''}" role="tab" data-rtab="_groups"><div class="persona-ic">${ic('settings')}</div><b>Tool groups</b><span>descriptions, 🔒, knowledge changes</span></div></div>`

function formCfg(){
  let rest; try { rest = JSON.parse($('#e-rest').value || '{}'); } catch(e){ throw new Error('Other settings: invalid JSON'); }
  const cfg = {...rest}, v = id => $(id).value, checked = cls => [...document.querySelectorAll(cls+':checked')].map(x=>x?.value);
  if(v('#e-conv').trim()) cfg.conv_id = v('#e-conv').trim();
  if(v('#e-caller')) cfg.caller = v('#e-caller');
  if(v('#e-persona')) cfg.persona = v('#e-persona');
  if(v('#e-net')) cfg.internet = v('#e-net');
  const t = v('#e-trig').split(',').map(x=>x.trim()).filter(Boolean); if(t?.length) cfg.trigger = t?.length===1 ? t[0] : t;
  cfg.roles = checked('.e-r');
  const add = checked('.e-x'), cut = checked('.e-b'); if(add.length) cfg.add_groups = add; if(cut.length) cfg.remove_groups = cut;

}

    const r = await api('/api/chat-config/apply', {op:'remove', name:EDIT.name, by:'panel'});
    if(r.ok){ alert(r?.message); EDIT=null; } else EDIT = {...EDIT, msg:r.message}; render(); };

  }

const KIND = {reply:['reply','green'], silent:['silent','gray'], already_answered:['someone already answered','blue']};
const hh = iso => new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const heatBg = (v, max) => v ? `color-mix(in oklab, var(--brand-35) ${Math.round(18+82*v/max)}%, var(--body-quaternary-bg))` : '';
function barChart(vals, hours, fmt, title, unit){
  const max = Math.max(...vals.map(v=>v||0), 0) || 1;
  const nice = (()=>{ const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max/p)*p; })();
  return `<div class="box"><h2>${title}</h2><p class="sub" style="margin-bottom:0">total ${fmt(vals.reduce((a,b)=>a+(b||0),0))}${unit} in 24 h · busiest at ${hh(hours[vals.indexOf(Math.max(...vals))])}</p>
    <div class="bars"><div class="gl" style="bottom:100%"><span>${fmt(nice)}</span></div><div class="gl" style="bottom:50%"><span>${fmt(nice/2)}</span></div>
      ${vals.map((v,i)=>`<div class="b" data-tip="${esc(`${hh(hours[i])}–${hh(new Date(new Date(hours[i]).getTime()+3600e3).toISOString())}\n${fmt(v||0)}${unit}`)}"><i style="height:${(v||0)/nice*100}%"></i></div>`).join('')}</div>
    <div class="xlab">${hours.map((h,i)=>`<span>${i%3===0?hh(h).slice(0,2):''}</span>`).join('')}</div></div>`;
}
function liveDashboard(D){
  const k = D.kpi, max = Math.max(1, ...D.chats.flatMap(c=>c.cells.map(x=>x[0]+x[1]+x[2])));
  const kpi = (v,l,tip='') => `<div class="ds-card" ${tip?`data-tip="${esc(tip)}"`:''}><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const cols = D.hours.length;
  const heat = D.chats.length ? `<div class="heat" style="grid-template-columns:minmax(140px,220px) repeat(${cols},minmax(10px,1fr)) auto">
      <span></span>${D.hours.map((h,i)=>`<span class="hx">${i%3===0?hh(h).slice(0,2):''}</span>`).join('')}<span></span>
      ${D.chats.map(c=>`<span class="hn" data-chatedit="${esc(c?.name)}" title="Chat settings">${esc(c?.name)}</span>`
        + c.cells.map((x,i)=>{ const v=x[0]+x[1]+x[2];
            return `<span class="c" style="${v?`background:${heatBg(v,max)}`:''}" data-chatgo="${esc(c?.name)}" data-tip="${esc(`${c.name}\n${hh(D.hours[i])}: ${v} messages to Bob\nreplied ${x[0]} · stayed silent ${x[1]} · someone already answered ${x[2]}`)}"></span>`; }).join('')
        + `<span class="tot" data-tip="${esc(`${c.name}: ${c.total} messages, replies ${c.replies}, Claude cost ${c.cost.toFixed(2)} $`)}">${c.total} · ${c.cost.toFixed(2)} $</span>`).join('')}</div>
      <div class="scale">0 <i></i> ${max} messages / h · click a cell to see the chat's conversations; click the name to open the chat's settings</div>`
    : empty('chat','Quiet in the chats','Nobody wrote to Bob in the last day.');
  const feed = D.feed.length ? `<div class="feed">${D.feed.map(f=>`<a data-chatgo="${esc(f?.chat)}"><span class="t">${hh(f.ts)}</span><span>${badge(esc(f?.chat))}</span><span>${badge(...KIND[f?.kind])}</span><span class="x">${esc(f?.sender?f?.sender+': ':'')}${esc(f?.text||'')}${f.kind==='reply'&&f?.reply?' → '+esc(f?.reply):''}</span></a>`).join('')}</div>` : '<span class="muted">No actions in the last day.</span>';
  return `<div class="row between" style="margin:var(--space-24) 0 var(--space-12)"><h2 style="margin:0;font-size:var(--text-xl)">Live - last 24 h</h2><span class="muted">refreshes every 15 s · hover to see details; click to dig deeper</span></div>
    <div class="kpis">${kpi(k?.handled,'messages to Bob','all messages Bob had to react to (he replied, stayed silent, or someone already answered)')}${kpi(k?.replies,'replies sent',k?.handled?`${Math.round(k.replies/k.handled*100)}% of messages`:'')}${kpi(k?.calls,'Claude calls','every reply, decision to stay silent and analysis is a model call')}
      ${kpi(k.cost.toFixed(2)+' $','Claude cost','sum of total_cost_usd from perf-metrics')}${kpi(k.median_s!=null?k.median_s+' s':'-','median reply time')}${kpi(k?.chats,'active chats')}</div>
    <div class="box"><h2>Where and when Bob worked</h2><p class="sub">Chat × hour - the darker, the more messages to Bob. On the right: total and Claude cost per chat.</p>${heat}</div>
    <div class="charts">${barChart(D.load.calls, D.hours, v=>String(Math.round(v)), 'Load: Claude calls per hour', '')}${barChart(D.load.cost, D.hours, v=>v.toFixed(2), 'Claude cost per hour', ' $')}</div>
    <div class="box"><div class="row between"><h2>What happened recently</h2>${btn('All conversations','data-go="conversations"','tertiary')}</div>${feed}</div>`;
}
function wireTips(){
  const tip = $('#tip');
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.onpointermove = e => { tip.textContent=''; el.dataset.tip.split('\n').filter(Boolean).forEach((line,i)=>{ const d=document.createElement(i?'div':'b'); d.textContent=line; tip.appendChild(d); });
      tip.style.display='block'; const w=tip.offsetWidth, h=tip.offsetHeight;
      tip.style.left=Math.max(8, Math.min(e.clientX+14, innerWidth-w-8))+'px'; tip.style.top=(e.clientY+14+h > innerHeight ? e.clientY-h-10 : e.clientY+14)+'px'; };
    el.onpointerleave = () => { tip.style.display='none'; };
  });
  // the 15 s refresh replaces the hovered element without a pointerleave - never leave a stale tooltip behind
  window.onscroll = () => { tip.style.display='none'; };
  document.querySelectorAll('[data-chatgo]').forEach(el=>el.onclick=()=>{ $('#tip').style.display='none'; ACHAT=el.dataset.chatgo; go('conversations'); });
  document.querySelectorAll('[data-chatedit]').forEach(el=>el.onclick=()=>{ $('#tip').style.display='none'; openChat(el.dataset.chatedit); });
}
// ---- reader: a knowledge file in a modal, rendered markdown ------------------------------------
function mdRender(src){
  // own small renderer: everything is escaped first, then only these constructs become HTML
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(„"])\*([^*\s][^*]*?)\*(?=[\s).,:;!?”"]|$)/g, '$1<i>$2</i>')
    .replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,:;!?]|$)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // <!-- ... --> = notes for whoever edits the file (e.g. where it is wired in) - not shown to the reader
  const L = String(src||'').replace(/\r/g,'').replace(/<!--[\s\S]*?-->/g,'').split('\n'), out = [], toc = []; let i = 0, n = 0;
  const isBlock = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+[.)])\s|\|)/.test(l) || /^(-{3,}|\*{3,}|_{3,})\s*$/.test(l);
  while(i < L.length){
    const l = L[i];
    if(!l.trim()){ i++; continue; }
    if(/^```/.test(l)){ const buf=[]; i++; while(i<L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue; }
    let m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(m){ const lv=m[1].length, id='h'+(n++); if(lv<=3) toc.push({lv, id, t:m[2].replace(/[`*_]/g,'')}); out.push(`<h${lv} id="${id}">${inline(m[2])}</h${lv}>`); i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^\|/.test(l) && i+1<L.length && /^\|?\s*:?-{2,}/.test(L[i+1])){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const h = cells(l); i += 2; const rows=[]; while(i<L.length && /^\|/.test(L[i])) rows.push(cells(L[i++]));
      out.push(`<table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue; }
    if(/^>/.test(l)){ const buf=[]; while(i<L.length && /^>/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,'')); out.push(`<blockquote>${mdRender(buf.join('\n')).html}</blockquote>`); continue; }
    if(/^\s*([-*+]|\d+[.)])\s/.test(l)){
      const ordered = /^\s*\d/.test(l), items=[];
      while(i<L.length && (/^\s*([-*+]|\d+[.)])\s/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        const mm = L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if(mm) items.push({lv:Math.min(2, Math.floor(mm[1].replace(/\t/g,'  ').length/2)), t:mm[3]}); else items[items.length-1].t += ' ' + L[i].trim();
        i++; }
      out.push(`<${ordered?'ol':'ul'}>${items.map(it=>`<li class="n${it.lv}">${inline(it.t)}</li>`).join('')}</${ordered?'ol':'ul'}>`); continue; }
    const buf=[]; while(i<L.length && L[i].trim() && !(buf.length && isBlock(L[i]))) buf.push(L[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
  }
  return {html: out.join('\n'), toc};
}
function renderModal(){
  const el = $('#modal');
  if(!MODAL){ el.innerHTML=''; document.body.style.overflow=''; return; }
  const M = MODAL, isJson = /\.json$/.test(M.path||'');
  let body, toc = [];
  if(isJson){ let pretty = M.text; try { pretty = JSON.stringify(JSON.parse(M.text), null, 2); } catch(e){} body = `<pre>${esc(pretty)}</pre>`; }
  else { const r = mdRender(M.text); body = `<div class="md">${r.html}</div>`; toc = r?.toc; }
  const words = (M.text||'').split(/\s+/).filter(Boolean).length;
  el.innerHTML = `<div class="reader-overlay" id="reader-ov"><div class="reader" role="dialog" aria-modal="true" aria-label="${esc(M.title)}">
    <div class="reader-head"><div><h2>${esc(M.title)}</h2><div class="meta">${M.meta||''}${badge(`${words} words · about ${Math.max(1,Math.round(words/200))} min read`)}${M.path?`<code>${esc(M.path)}</code>`:''}</div></div>
      <div class="row" style="flex-wrap:nowrap"><input class="ds-input" id="reader-q" placeholder="Search the text…" style="height:32px;width:200px"><button class="ds-modal-close" id="reader-x" aria-label="Close">${ic('cross')}</button></div></div>
    <div class="reader-main"><nav class="reader-toc">${toc.length?`<div class="lbl">Contents</div>${toc.map(h=>`<a class="l${h.lv}" data-to="${h.id}">${esc(h.t)}</a>`).join('')}`:'<span class="muted" style="padding:0 var(--space-8)">No headings</span>'}</nav>
      <div class="reader-body" id="reader-body">${body}</div></div>
    <div class="reader-foot"><span class="msg" id="reader-msg"></span>${(M.actions||[]).map((a,k)=>btn(a?.label,`data-ract="${k}"`,a?.kind||'secondary')).join('')}${M.path?btn('Copy path','id="reader-copy"','tertiary'):''}${btn('Close','id="reader-close"')}</div></div></div>`;
  document.body.style.overflow='hidden';
  const close = () => { MODAL=null; renderModal(); };
  $('#reader-x').onclick = close; $('#reader-close').onclick = close;
  $('#reader-ov').onclick = e => { if(e.target.id==='reader-ov') close(); };
  el.querySelectorAll('[data-to]').forEach(a=>a['onclick']=()=>document.getElementById(a.dataset.to)?.scrollIntoView({behavior:'smooth'}));
  el.querySelectorAll('[data-ract]').forEach(b=>b['onclick']=()=>M.actions[+b.dataset.ract].run());
  const cp=$('#reader-copy'); if(cp) cp.onclick=async()=>{ try { await navigator.clipboard.writeText(M.path); $('#reader-msg').textContent='Path copied.'; } catch(e){ $('#reader-msg').textContent=M.path; } };
  const q=$('#reader-q'), original = $('#reader-body').innerHTML;
  q['oninput'] = () => { const v=q.value.trim(); const b=$('#reader-body'); b.innerHTML = original; if(v?.length<2){ $('#reader-msg').textContent=''; return; }
    const walker = document.createTreeWalker(b, NodeFilter.SHOW_TEXT), hits=[], re = new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    let nd; while((nd=walker.nextNode())) if(re.test(nd.nodeValue)) hits.push(nd);
    const reg = new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); let count = 0;
    hits.forEach(t=>{ const frag=document.createDocumentFragment(), txt=t.nodeValue; let last=0, m;
      reg.lastIndex=0; while((m=reg.exec(txt))){ frag.append(txt.slice(last, m?.index)); const mk=document.createElement('mark'); mk.textContent=m[0]; frag.append(mk); last=m?.index+m[0].length; count++; }
      frag.append(txt.slice(last)); t.replaceWith(frag); });
    const first=b.querySelector('mark'); if(first) first.scrollIntoView({block:'center'}); $('#reader-msg').textContent = count?`Found: ${count}.`:'No results.'; };
  q.focus();
}
document.addEventListener('keydown', e=>{ if(e?.key==='Escape' && MODAL){ MODAL=null; renderModal(); } });
async function openKnowledge(role, entry){
  const r = (ROLES?.roles||[]).find(x=>x.id===role) || {}, k = (r?.knowledge||[]).find(x=>x.id===entry);
  if(!k) return;
  const res = await api('/api/roles/knowledge?file='+encodeURIComponent(k?.file));
  if(res.error){ alert(res.message||'Could not open the file.'); return; }
  MODAL = {title:k?.name, path:k?.file, text:res.text||'',
    meta: badge(esc(`${r.emoji||''} ${r.name}`),'brand') + badge(esc(WIRING[k?.wiring]||k?.wiring)) + (k.team_only?badge('team only 🔒','yellow'):'') + (k?.modified?badge('changed '+ago(k?.modified)+' ago'):''),
    actions:[{label:'Edit with Claude', kind:'primary', run:()=>{ MODAL=null; renderModal(); KN={role, entry}; RED=null; render().then(()=>$('#kn')?.scrollIntoView()); }}]};
  renderModal();
}
// ---- wiring ---------------------------------------------------------------------------------------
function wireCommon(){
  document.querySelectorAll('[data-go]').forEach(a=>a['onclick']=()=>go(a.dataset.go));
  document.querySelectorAll('[data-bob]').forEach(b=>b['onclick']=()=>bobAction(b.dataset.bob, b));
  const loginGo = async then_start => { const r = await api('/api/bob/login', {then_start, by:'panel'}); if($('#lmsg')) $('#lmsg').textContent = r?.message||''; setTimeout(render, 2500); };
  document.querySelectorAll('#b-login').forEach(b=>b['onclick']=()=>loginGo(false));
  const ls=$('#b-login-start'); if(ls) ls.onclick=()=>loginGo(true);
  const lo=$('#b-login-ok'); if(lo) lo.onclick=async()=>{ lo.disabled=true; try { const r = await api('/api/bob/login/confirm', {by:'panel'}); $('#lmsg').textContent=r?.message||''; setTimeout(render, 6000); } finally { lo.disabled=false; } };
  document.querySelectorAll('.apr').forEach(el=>el.querySelectorAll('button[data-a]').forEach(b=>b['onclick']=async()=>{
    const approve = b.dataset.a==='1'; b['disabled']=true;
    try { const res = await api(`/api/approvals/${el.dataset.id}/decide`, {approve, note: el.querySelector('textarea').value});
      el.querySelector('.msg').textContent = res.message || (res.ok?'Saved.':'Error'); setTimeout(render, 900); } finally { b['disabled']=false; }
  }));
  const ac=$('#achat'); if(ac) ac.onchange=()=>{ ACHAT=ac.value; render(); };
  document.querySelectorAll('[data-lf]').forEach(b=>b['onclick']=()=>{ LOGF[b.dataset.lf]=b.dataset.v; render(); });
  const lsrc=$('#lsrc'); if(lsrc) lsrc.onchange=()=>{ LOGF.source=lsrc.value; render(); };
  const lq=$('#lq'); if(lq) lq.onkeydown=e=>{ if(e?.key==='Enter'){ LOGF.q=lq.value; render(); } };
  const raw=$('#rawlog'); if(raw) raw.closest('details').ontoggle=async e=>{ if(e.target.open){ const l=await api('/api/bob/log?lines=300'); raw.textContent=l.log||'(empty - Bob has not been started from the panel yet)'; } };
}
let rendering = null, again = false;
function render(){
  // one render at a time; a call during a render queues one more and gets a promise for the end of it
  if(rendering){ again = true; return rendering; }
  rendering = (async () => { try { do { again = false; await renderOnce(); } while(again); } finally { rendering = null; } })();
  return rendering;
}
async function renderOnce(){
  {
    nav();
    const tipEl = $('#tip'); if(tipEl) tipEl.style.display = 'none';
    try { $('#main').innerHTML = await VIEWS[tab](); } catch(e){ $('#main').innerHTML = `<div class="box">${callout('danger','Panel error: '+esc(e))}</div>`; }
    if(tab!=='dashboard') header();
    wireCommon();
    wireTips();
    if(tab==='chats') wireEditor();
    if(tab==='roles') wireRoles();
  }
}
$('#theme').onclick=()=>{ const t = document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; try { localStorage.setItem('bob-theme', t); } catch(e){} };
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (ALL.some(x => x[0] === t) && t !== tab) go(t); });
render();
// refresh every 15 s - not while you are editing, reading a file or typing
setInterval(()=>{ if(!EDIT && !RED && !KN && !MODAL && !document.querySelector('details[open] #rawlog')
  && !document.activeElement?.matches('input,textarea,select') && !document.querySelector('button:disabled:not(#e-save)')) render(); }, 15000);
</script>
