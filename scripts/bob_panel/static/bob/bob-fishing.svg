<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-fish {
        transform-origin: 7.5px 13px;
        animation: body-fish 8s infinite ease-in-out;
      }
      .shadow-fish {
        transform-origin: 7.5px 15.5px;
        animation: shadow-fish 8s infinite ease-in-out;
      }
      .eyes-fish {
        transform-origin: 7.5px 7px;
        animation: blink-fish 8s infinite;
      }
      .pupils-fish {
        animation: pupils-fish 8s infinite ease-in-out;
      }
      .rod-sway {
        transform-origin: 14px 8px;
        animation: rod-sway 8s infinite ease-in-out;
      }
      .line-sway {
        animation: line-sway 8s infinite ease-in-out;
      }
      .bobber-bob {
        animation: bobber-bob 2.5s infinite ease-in-out;
      }
      .ripple {
        opacity: 0;
        animation: ripple-out 3s infinite ease-out;
      }
      .rp-1 { animation-delay: 0s; }
      .rp-2 { animation-delay: 1.5s; }
      .lily-float {
        animation: lily-float 8s infinite ease-in-out;
      }
      .water-line {
        animation: water-wave 4s infinite ease-in-out;
      }
      .wl-2 { animation-delay: -1s; }
      .wl-3 { animation-delay: -2s; }

      @keyframes body-fish {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-0.5px); }
      }

      @keyframes shadow-fish {
        0%, 100% { transform: scaleX(1); opacity: 0.3; }
        50%      { transform: scaleX(1.02); opacity: 0.35; }
      }

      @keyframes blink-fish {
        0%, 30%, 34%, 65%, 69%, 100% { transform: scaleY(1); }
        32% { transform: scaleY(0.1); }
        67% { transform: scaleY(0.1); }
      }

      @keyframes pupils-fish {
        0%, 15%   { transform: translate(0, 0); }
        25%, 40%  { transform: translate(1px, 0.5px); }
        50%, 60%  { transform: translate(0, 0); }
        70%, 85%  { transform: translate(0.5px, 0.3px); }
        95%, 100% { transform: translate(0, 0); }
      }

      @keyframes rod-sway {
        0%, 100% { transform: rotate(0deg); }
        30%      { transform: rotate(2deg); }
        70%      { transform: rotate(-1deg); }
      }

      @keyframes line-sway {
        0%, 100% { transform: translateX(0); }
        30%      { transform: translateX(0.5px); }
        70%      { transform: translateX(-0.3px); }
      }

      @keyframes bobber-bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(0.8px); }
      }

      @keyframes ripple-out {
        0%   { transform: scale(0.3); opacity: 0; }
        15%  { opacity: 0.5; }
        100% { transform: scale(2); opacity: 0; }
      }

      @keyframes lily-float {
        0%, 100% { transform: translate(0, 0); }
        30%      { transform: translate(0.3px, 0.2px); }
        70%      { transform: translate(-0.2px, -0.1px); }
      }

      @keyframes water-wave {
        0%, 100% { transform: translateX(0); opacity: 0.15; }
        50%      { transform: translateX(1px); opacity: 0.25; }
      }
    </style>
  </defs>

  <!-- Water surface lines -->
  <rect class="water-line" x="-10" y="14" width="40" height="0.5" fill="#4A90D9" opacity="0.15"/>
  <rect class="water-line wl-2" x="-8" y="15.5" width="35" height="0.4" fill="#4A90D9" opacity="0.12"/>
  <rect class="water-line wl-3" x="-12" y="17" width="42" height="0.3" fill="#4A90D9" opacity="0.1"/>

  <!-- Ripples at bobber -->
  <g transform="translate(22, 14)">
    <rect class="ripple rp-1" x="-1.5" y="0" width="3" height="0.4" fill="#4A90D9" rx="0.2"/>
    <rect class="ripple rp-2" x="-1" y="0" width="2" height="0.3" fill="#4A90D9" rx="0.15"/>
  </g>

  <!-- Brown boat -->
  <g class="lily-float">
    <rect x="-1" y="13" width="17" height="2" fill="#8B6914"/>
    <rect x="0" y="12.5" width="15" height="0.7" fill="#A07828"/>
    <rect x="-2" y="13.5" width="1" height="1" fill="#6B5010"/>
    <rect x="16" y="13.5" width="1" height="1" fill="#6B5010"/>
    <rect x="1" y="14.5" width="13" height="0.5" fill="#6B5010"/>
  </g>

  <!-- Shadow on boat -->
  <rect class="shadow-fish" x="3" y="14" width="9" height="0.5" fill="#5A4010"/>

  <!-- Bob sitting on lily pad -->
  <g class="body-fish">
    <!-- Legs (tucked, sitting pose) -->
    <g fill="#2e7d3a">
      <rect x="2" y="12" width="2" height="1"/>
      <rect x="5" y="12" width="2" height="1"/>
      <rect x="8" y="12" width="2" height="1"/>
      <rect x="11" y="12" width="2" height="1"/>
    </g>

    <!-- Torso + belly + cheeks -->
    <g fill="#2e7d3a">
      <rect x="2" y="6" width="11" height="6"/>
      <rect x="4" y="9" width="7" height="3" fill="#6ec46e"/>
      <rect x="3" y="10" width="1" height="1" fill="#45a04f"/>
      <rect x="12" y="10" width="1" height="1" fill="#45a04f"/>
    </g>

    <!-- Left arm (resting) -->
    <g fill="#2e7d3a">
      <rect x="0" y="9" width="2" height="2"/>
    </g>

    <!-- Right arm (holding rod, raised) -->
    <g fill="#2e7d3a">
      <rect x="13" y="8" width="2" height="2"/>
    </g>

    <!-- Eyes -->
    <g class="eyes-fish">
      <g class="pupils-fish">
        <rect x="2" y="5" width="5" height="1" fill="#2e7d3a"/>
        <rect x="1" y="6" width="6" height="3" fill="#2e7d3a"/>
        <rect x="2" y="6" width="4" height="3" fill="#d4eed4"/>
        <rect x="4" y="7" width="2" height="2" fill="#111"/>
        <rect x="2.5" y="6.5" width="1" height="1" fill="rgba(255,255,255,0.6)"/>

        <rect x="8.5" y="5" width="5" height="1" fill="#2e7d3a"/>
        <rect x="8" y="6" width="6" height="3" fill="#2e7d3a"/>
        <rect x="9" y="6" width="4" height="3" fill="#d4eed4"/>
        <rect x="9" y="7" width="2" height="2" fill="#111"/>
        <rect x="11.5" y="6.5" width="1" height="1" fill="rgba(255,255,255,0.6)"/>
      </g>
    </g>

    <!-- Fishing rod -->
    <g class="rod-sway">
      <rect x="14" y="-6" width="1" height="15" fill="#8D6E63"/>
      <rect x="14.3" y="-6" width="0.4" height="1" fill="#A1887F"/>
      <!-- Fishing line -->
      <g class="line-sway">
        <rect x="14.5" y="-6" width="0.3" height="6" fill="#999" opacity="0.6"/>
        <rect x="15" y="-2" width="0.3" height="4" fill="#999" opacity="0.5"/>
        <rect x="16" y="0" width="0.3" height="5" fill="#999" opacity="0.4"/>
        <rect x="17" y="3" width="0.3" height="5" fill="#999" opacity="0.35"/>
        <rect x="18" y="5" width="0.3" height="4" fill="#999" opacity="0.3"/>
        <rect x="19" y="7" width="0.3" height="3.5" fill="#999" opacity="0.25"/>
        <rect x="20" y="9" width="0.3" height="3" fill="#999" opacity="0.2"/>
        <rect x="21" y="11" width="0.3" height="2" fill="#999" opacity="0.18"/>
        <!-- Bobber -->
        <g class="bobber-bob">
          <rect x="21" y="12.5" width="1.5" height="1" fill="#E53935"/>
          <rect x="21" y="13.5" width="1.5" height="0.5" fill="#F5F5F5"/>
        </g>
      </g>
    </g>
  </g>
</svg>