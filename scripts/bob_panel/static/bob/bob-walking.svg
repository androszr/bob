<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-hop {
        animation: hop 1.2s infinite ease-in-out;
      }
      .shadow-hop {
        transform-origin: 7.5px 15.5px;
        animation: shadow-hop 1.2s infinite ease-in-out;
      }
      .legs-crouch {
        animation: legs-crouch 1.2s infinite ease-in-out;
      }
      .eyes-blink {
        transform-origin: 7.5px 7px;
        animation: blink 4s infinite;
      }

      @keyframes hop {
        0%, 100% { transform: translate(0, 0) scaleY(1); }
        15% { transform: translate(0, 2px) scaleY(0.85); }
        30% { transform: translate(0, -8px) scaleY(1.05); }
        50% { transform: translate(0, -10px) scaleY(1); }
        70% { transform: translate(0, -4px) scaleY(1); }
        85% { transform: translate(0, 1px) scaleY(0.9); }
        95% { transform: translate(0, 0) scaleY(1); }
      }

      @keyframes shadow-hop {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        15% { transform: scaleX(1.15); opacity: 0.6; }
        30% { transform: scaleX(0.6); opacity: 0.2; }
        50% { transform: scaleX(0.5); opacity: 0.15; }
        70% { transform: scaleX(0.7); opacity: 0.3; }
        85% { transform: scaleX(1.1); opacity: 0.55; }
      }

      @keyframes legs-crouch {
        0%, 100% { transform: translate(0, 0) scaleY(1); }
        15% { transform: translate(0, -1px) scaleY(0.5); }
        30%, 70% { transform: translate(0, 0) scaleY(1.2); }
        85% { transform: translate(0, -1px) scaleY(0.5); }
      }

      @keyframes blink {
        0%, 8%, 100% { transform: scaleY(1); }
        4% { transform: scaleY(0.1); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-hop" x="3" y="15" width="9" height="1" fill="#000000"/>

  <g class="body-hop">
    <!-- Legs -->
    <g class="legs-crouch" fill="#2e7d3a">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
    </g>

    <!-- Body -->
    <g fill="#2e7d3a">
      <rect x="2" y="6" width="11" height="7"/>
      <rect x="4" y="9" width="7" height="3" fill="#6ec46e"/>
      <rect x="0" y="9" width="2" height="2"/>
      <rect x="13" y="9" width="2" height="2"/>
      <rect x="3" y="10" width="1" height="1" fill="#45a04f"/>
      <rect x="12" y="10" width="1" height="1" fill="#45a04f"/>
    </g>

    <!-- Protruding frog eyes -->
    <g class="eyes-blink">
      <rect x="2" y="5" width="5" height="1" fill="#2e7d3a"/>
      <rect x="1" y="6" width="6" height="3" fill="#2e7d3a"/>
      <rect x="2" y="6" width="4" height="3" fill="#d4eed4"/>
      <rect x="4" y="7" width="2" height="2" fill="#111"/>
      <rect x="2.5" y="6.5" width="1" height="1" fill="rgba(255,255,255,0.6)"/>
      <rect x="8.5" y="5" width="5" height="1" fill="#2e7d3a"/>
      <rect x="8" y="6" width="6" height="3" fill="#2e7d3a"/>
      <rect x="9" y="6" width="4" height="3" fill="#d4eed4"/>
      <rect x="9" y="7" width="2" height="2" fill="#111"/>
      <rect x="11.5" y="6.5" width="1" height="1" fill="rgba(255,255,255,0.6)"/>
    </g>
  </g>
</svg>