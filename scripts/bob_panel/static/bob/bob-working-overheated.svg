<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -20 40 40" width="500" height="500">
  <defs>
    <style>
      .breathe {
        transform-origin: 7.5px 15px;
        animation: breathe-squash 4.5s infinite ease-in-out;
      }
      .shadow-breathe {
        transform-origin: 7.5px 15.5px;
        animation: shadow-pulse 4.5s infinite ease-in-out;
      }
      .smoke {
        opacity: 0;
      }
      .sm1 { animation: smoke-float-1 4s infinite ease-out; }
      .sm2 { animation: smoke-float-2 4s infinite ease-out; animation-delay: 1.3s; }
      .sm3 { animation: smoke-float-3 4s infinite ease-out; animation-delay: 2.6s; }

      @keyframes breathe-squash {
        0%, 80%, 100% { transform: scale(1, 1); }
        30%, 40% { transform: scale(1.02, 1.25); }
      }
      @keyframes shadow-pulse {
        0%, 80%, 100% { transform: scaleX(1); opacity: 0.4; }
        30%, 40% { transform: scaleX(1.05); opacity: 0.5; }
      }
      @keyframes smoke-float-1 {
        0%   { transform: translate(5px, 8px) scale(0.4); opacity: 0; }
        10%  { opacity: 0.6; }
        50%  { transform: translate(8px, 0px) scale(1); opacity: 0.4; }
        100% { transform: translate(6px, -8px) scale(1.5); opacity: 0; }
      }
      @keyframes smoke-float-2 {
        0%   { transform: translate(8px, 9px) scale(0.3); opacity: 0; }
        10%  { opacity: 0.5; }
        50%  { transform: translate(5px, 1px) scale(0.9); opacity: 0.3; }
        100% { transform: translate(9px, -7px) scale(1.4); opacity: 0; }
      }
      @keyframes smoke-float-3 {
        0%   { transform: translate(6px, 7px) scale(0.5); opacity: 0; }
        10%  { opacity: 0.5; }
        50%  { transform: translate(9px, -1px) scale(1.1); opacity: 0.3; }
        100% { transform: translate(5px, -9px) scale(1.6); opacity: 0; }
      }
    </style>
    <g id="smoke-puff">
      <rect x="-1" y="-1" width="3" height="2" fill="#B0BEC5" rx="0.5"/>
      <rect x="0" y="-2" width="2" height="2" fill="#CFD8DC" rx="0.5"/>
    </g>
  </defs>

  <!-- Ground Shadow -->
  <rect id="ground-shadow" class="shadow-breathe" x="-1" y="15" width="17" height="1" fill="#000000"/>

  <!-- Smoke puffs -->
  <g>
    <use href="#smoke-puff" class="smoke sm1"/>
    <use href="#smoke-puff" class="smoke sm2"/>
    <use href="#smoke-puff" class="smoke sm3"/>
  </g>

  <!-- Splooted / Overheated Pose -->
  <g class="breathe">
    <!-- Legs pointing up from behind -->
    <g fill="#2e7d3a">
      <rect x="3" y="9" width="1" height="1"/>
      <rect x="5" y="9" width="1" height="1"/>
      <rect x="9" y="9" width="1" height="1"/>
      <rect x="11" y="9" width="1" height="1"/>
    </g>

    <!-- Squashed Body -->
    <g fill="#2e7d3a">
      <rect x="1" y="10" width="13" height="5"/>
      <rect x="4" y="9" width="7" height="3" fill="#6ec46e"/>
      <rect x="-1" y="13" width="2" height="2"/>
      <rect x="14" y="13" width="2" height="2"/>
      <rect x="1" y="12" width="1" height="1" fill="#45a04f"/>
      <rect x="13" y="12" width="1" height="1" fill="#45a04f"/>
    </g>

    <!-- Protruding frog eyes (tired/half-closed) -->
    <g>
      <!-- Left eye bulge -->
      <rect x="2" y="11" width="5" height="1" fill="#2e7d3a"/>
      <rect x="1" y="12" width="6" height="2" fill="#2e7d3a"/>
      <!-- Left tired eye (half-open sclera + droopy lid covering top half) -->
      <rect x="2" y="12" width="4" height="2" fill="#d4eed4"/>
      <rect x="2" y="12" width="4" height="1" fill="#2e7d3a"/>
      <rect x="3" y="12.5" width="2" height="1.5" fill="#111"/>
      <rect x="2.5" y="12.5" width="1" height="0.5" fill="rgba(255,255,255,0.4)"/>

      <!-- Right eye bulge -->
      <rect x="8.5" y="11" width="5" height="1" fill="#2e7d3a"/>
      <rect x="8" y="12" width="6" height="2" fill="#2e7d3a"/>
      <!-- Right tired eye -->
      <rect x="9" y="12" width="4" height="2" fill="#d4eed4"/>
      <rect x="9" y="12" width="4" height="1" fill="#2e7d3a"/>
      <rect x="10" y="12.5" width="2" height="1.5" fill="#111"/>
      <rect x="11.5" y="12.5" width="1" height="0.5" fill="rgba(255,255,255,0.4)"/>
    </g>
  </g>
</svg>